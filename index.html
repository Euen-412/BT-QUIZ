<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>서바이벌 퀴즈</title>
<link rel="stylesheet" href="/common.css">
<script src="/config.js"></script>
<style>
body{overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#join{align-items:center;justify-content:center;padding:24px;gap:16px;background:radial-gradient(circle at 50% 0%,#36406b,var(--bg) 70%)}
.logo{font-size:40px;text-align:center;line-height:1.1}
.logo small{display:block;font-size:18px;color:var(--gold);margin-top:6px}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:360px;width:100%;max-height:150px;overflow:auto;padding:4px}
.picker button{font-size:24px;background:var(--panel);border:2px solid transparent;border-radius:10px;padding:4px 0}
.picker button.sel{border-color:var(--gold);background:#4a3f1a}
.inp{width:100%;max-width:360px;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--text);text-align:center;outline:none}
.inp:focus{border-color:var(--gold)}
.big{width:100%;max-width:360px;font-size:22px;padding:16px;border:0;border-radius:14px;background:var(--gold);color:#2a2100;font-weight:900}
.big:disabled{opacity:.5}
#joinErr{color:var(--x);min-height:20px;font-size:14px;text-align:center}
.top{padding:12px 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px}
.me{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:700;white-space:nowrap}
.qbox{font-size:21px;font-weight:900;line-height:1.35;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 2px 10px;word-break:keep-all}
.field{flex:1;position:relative;display:flex}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:0;color:var(--text);transition:background .2s;padding:10px}
.half.a{background:var(--o-soft)} .half.b{background:var(--x-soft)}
.half .sym{font-size:110px} .half .word{font-size:min(60px,calc(42vw / var(--n)))}
.half .cnt{font-size:15px;color:var(--muted);font-weight:700}
.half.a.pick{background:rgba(47,140,255,.45)} .half.b.pick{background:rgba(255,77,94,.45)}
.divider{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(var(--gold) 0 26px,transparent 26px 46px);opacity:.8;pointer-events:none}
#myAv{position:absolute;bottom:26px;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;display:grid;place-items:center;font-size:44px;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:left .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:3}
#myAv b{position:absolute;bottom:-22px;font-size:12px;white-space:nowrap;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:99px}
#crowd{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.cv{position:absolute;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.9);transition:left .6s cubic-bezier(.3,1.3,.5,1),top .6s cubic-bezier(.3,1.3,.5,1),opacity .4s,filter .4s;line-height:1}
.cv.dead{opacity:.3;filter:grayscale(1)}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:99px;font-size:14px;color:#fff;pointer-events:none;z-index:2}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;background:rgba(20,23,35,.93);z-index:5}
.ov.on{display:flex}
.ov .huge{font-size:56px}
.ov .sub{font-size:16px;color:var(--muted);line-height:1.5;word-break:keep-all}
.answer .sym{font-size:150px}.answer .word{font-size:min(80px,calc(85vw / var(--n)))}
.res{font-size:40px}
.res.ok{color:var(--ok)} .res.bad{color:var(--x)} .res.saved{color:var(--gold)}
.winners{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:40vh;overflow:auto}
.winners span{background:var(--panel);padding:6px 12px;border-radius:99px;font-size:15px}
.ghost{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);text-align:center;padding:10px;font-size:14px;color:var(--gold);z-index:4}
</style>
</head><body>
<div class="boot" id="boot">연결 중…</div>

<section id="join" class="screen">
  <div class="logo title">서바이벌 퀴즈<small>최후의 1인에 도전!</small></div>
  <input id="room" class="inp" maxlength="6" placeholder="방 코드" style="text-transform:uppercase;display:none">
  <div class="picker" id="picker"></div>
  <input id="name" class="inp" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
  <button class="big" id="joinBtn">참가하기</button>
  <div id="joinErr"></div>
</section>

<section id="game" class="screen">
  <div class="top">
    <div class="meta"><span class="me" id="meTag"></span><span id="metaR"></span></div>
    <div class="qbox" id="q"></div>
    <div class="timerbar" id="tb"><i id="tbi" style="width:100%"></i></div>
  </div>
  <div class="field">
    <button class="half a" id="hA"><span id="lA"></span><span class="cnt" id="cA"></span></button>
    <button class="half b" id="hB"><span id="lB"></span><span class="cnt" id="cB"></span></button>
    <div class="divider"></div>
    <div id="crowd"></div>
    <div class="hint" id="hint">정답이라고 생각하는 쪽을 누르세요</div>
    <div id="myAv"><span id="myEmo"></span><b id="myName"></b></div>
    <div class="ghost" id="ghost" style="display:none"></div>
    <div class="ov" id="ovLobby"><div class="huge" id="lobEmo"></div><div class="title" style="font-size:30px" id="lobName"></div><div class="sub" id="lobSub"></div></div>
    <div class="ov" id="ovLocked"><div class="title huge">마감!</div><div class="sub" id="lockSub">정답 공개를 기다리는 중…</div></div>
    <div class="ov" id="ovReveal"><div class="sub">정답은</div><div class="answer" id="ans"></div><div class="res title" id="res"></div><div class="sub" id="exp"></div><div class="sub" id="surv"></div></div>
    <div class="ov" id="ovEnd"><div class="title huge" id="endTitle">게임 종료</div><div class="sub" id="endSub"></div><div class="winners" id="winners"></div></div>
  </div>
</section>

<script type="module">
import { initDB, qs, esc, labelHTML, makeClock } from '/db.js';
const AV=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐤','🦆','🦉','🐺','🐗','🐴','🦄','🐝','🐢','🐙','🦀','🐳','🐬','🦖','🦕','🐲','👻','🤖','👽','🎃','🦔','🦦','🐿️'];
const COLORS=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#38d9a9','#4dabf7','#748ffc','#da77f2','#f783ac','#a9e34b'];
const $=id=>document.getElementById(id);
let R=null, me=null, joined=false, pick=AV[Math.floor(Math.random()*AV.length)], myChoice='', myRound=-1, room=(qs.get('r')||localStorage.getItem('q_room')||'').toUpperCase();
const clock=makeClock();
$('name').value=localStorage.getItem('q_name')||'';
$('picker').innerHTML=AV.map(a=>`<button data-a="${a}">${a}</button>`).join('');
const markPick=()=>[...$('picker').children].forEach(b=>b.classList.toggle('sel',b.dataset.a===pick));
$('picker').onclick=e=>{const b=e.target.closest('button');if(b){pick=b.dataset.a;markPick()}};markPick();
const show=id=>['join','game'].forEach(s=>$(s).classList.toggle('on',s===id));

let db;
try{db=await initDB()}catch(e){$('boot').classList.add('err');$('boot').textContent='연결 실패: '+e.message;throw e}
$('boot').remove();
let offRoom=null, offMe=null;

function enterRoom(code){
  room=code.toUpperCase();localStorage.setItem('q_room',room);
  offRoom&&offRoom();offMe&&offMe();
  offRoom=db.watch(`rooms/${room}`,d=>{R=d;if(!d){joined=false;show('join');$('room').style.display='';$('joinErr').textContent='방을 찾을 수 없어요. 방 코드를 확인해 주세요';return}render()});
  offMe=db.watch(`rooms/${room}/players/${db.uid}`,d=>{
    if(d){me=d;if(!joined){joined=true;show('game')}if(d.round===R?.round&&d.choice!==undefined&&myRound!==R?.round){myChoice=d.choice;myRound=d.round}}
    else{if(joined){$('joinErr').textContent='진행자에 의해 퇴장되었어요'}joined=false;me=null;show('join')}
    render()});
}
if(room)enterRoom(room);else{$('room').style.display='';show('join')}

async function doJoin(){
  const n=$('name').value.trim();if(!n){$('joinErr').textContent='닉네임을 입력해 주세요';return}
  const code=($('room').value||room).trim().toUpperCase();if(!code){$('joinErr').textContent='방 코드를 입력해 주세요';return}
  if(code!==room)enterRoom(code);
  $('joinBtn').disabled=true;$('joinErr').textContent='';
  try{
    const r=await db.get(`rooms/${code}`);
    if(!r)throw new Error('방을 찾을 수 없어요');
    if(!r.joinOpen)throw new Error('지금은 참가가 마감되었어요');
    localStorage.setItem('q_name',n);
    await db.create(`rooms/${code}/players/${db.uid}`,{name:n.slice(0,10),avatar:pick,color:COLORS[Math.floor(Math.random()*COLORS.length)],choice:'',round:0,late:r.phase!=='lobby',g:r.g||0});
  }catch(e){$('joinErr').textContent=/permission|PERMISSION/i.test(e.message)?'지금은 참가할 수 없어요 (참가 마감)':e.message}
  $('joinBtn').disabled=false;
}
$('joinBtn').onclick=doJoin;$('name').onkeydown=e=>{if(e.key==='Enter')doJoin()};
show(room?'game':'join');

function isAlive(){if(!R||!me)return false;const d=R.dead||{},rv=R.revived||{};
  if(d[db.uid]!==undefined)return false;if(me.late&&me.g===(R.g||0)&&!rv[db.uid])return false;return true}
function curChoice(){return myRound===R?.round?myChoice:''}

async function move(side){
  if(!R||!me||!isAlive()||R.phase!=='question'||clock(R)<=0)return;
  const prev=curChoice();if(prev===side)return;
  myChoice=side;myRound=R.round;if(navigator.vibrate)navigator.vibrate(15);paintMe();
  try{await db.update(`rooms/${room}/players/${db.uid}`,{choice:side,round:R.round})}
  catch(e){myChoice=prev;paintMe();$('hint').style.display='';$('hint').textContent='시간이 끝나서 바꿀 수 없어요'}
}
$('hA').onclick=()=>move('A');$('hB').onclick=()=>move('B');

function paintMe(){const s=curChoice();$('myAv').style.left=s==='A'?'20%':s==='B'?'80%':'50%';
  $('hA').classList.toggle('pick',s==='A');$('hB').classList.toggle('pick',s==='B')}

function render(){
  if(!R||!me)return;
  const alive=isAlive(),P=R.phase;
  $('meTag').innerHTML=`${me.avatar} ${esc(me.name)} ${alive?'<span style="color:var(--ok)">● 생존</span>':'<span style="color:var(--x)">● 관전</span>'}`;
  $('metaR').textContent=P==='lobby'?`방 ${room}`:`${R.qNo}/${R.qTotal} 라운드`;
  $('q').textContent=R.q||'곧 첫 문제가 나옵니다!';
  $('lA').innerHTML=labelHTML(R.a||'O','A');$('lB').innerHTML=labelHTML(R.b||'X','B');
  $('myEmo').textContent=me.avatar;$('myName').textContent=me.name;$('myAv').style.background=me.color;$('myAv').style.opacity=alive?1:.35;
  $('cA').textContent='';$('cB').textContent='';
  paintMe();renderCrowd();
  const g=$('ghost');
  if(!alive&&P!=='lobby'&&P!=='ended'){g.style.display='';g.textContent=(R.dead||{})[db.uid]!==undefined?'탈락했어요 — 관전 중 (진행자가 부활시키면 다시 참여!)':'게임 도중에 들어왔어요 — 관전 중'}else g.style.display='none';
  $('ovLobby').classList.toggle('on',P==='lobby');
  $('lobEmo').textContent=me.avatar;$('lobName').textContent=me.name;$('lobSub').textContent='참가 완료! 진행자가 곧 시작해요';
  $('ovReveal').classList.toggle('on',P==='reveal');
  if(P==='reveal'){
    const win=R.ans==='A'?R.a:R.b;$('ans').innerHTML=labelHTML(win,R.ans);
    const r=$('res');r.className='res title';
    const wasIn=curChoice()&&R.ans;
    if(alive&&curChoice()===R.ans){r.textContent='정답! 생존 🎉';r.classList.add('ok')}
    else if((R.dead||{})[db.uid]===R.round){r.textContent=curChoice()?'탈락 😭':'시간 초과 · 탈락 😭';r.classList.add('bad')}
    else if(alive&&R.stats&&R.stats.saved){r.textContent='전원 오답 → 모두 생존!';r.classList.add('saved')}
    else r.textContent='';
    $('exp').textContent=R.e||'';$('surv').textContent=R.stats?`생존자 ${R.stats.survivors}명`:'';
  }
  $('ovEnd').classList.toggle('on',P==='ended');
  if(P==='ended'){const w=R.winners||[];
    $('endTitle').textContent=alive?(w.length===1?'🏆 최후의 1인!':'🏆 최종 생존!'):'게임 종료';
    $('endSub').textContent=w.length?`최종 생존자 ${w.length}명`:'생존자가 없어요';
    $('winners').innerHTML=w.slice(0,100).map(([n,a])=>`<span>${a} ${esc(n)}</span>`).join('')}
}
let posKey='',crowdEls=new Map();
function renderCrowd(force){
  const box=$('crowd');
  if(!R||R.crowd===false||!R.pos||R.phase==='ended'){if(crowdEls.size){box.innerHTML='';crowdEls.clear()}posKey='';return}
  const key=R.pos+'|'+R.phase+'|'+(R.ans||'')+'|'+box.clientWidth+'x'+box.clientHeight;
  if(key===posKey&&!force)return;posKey=key;
  const mine=db.uid.slice(0,10),W=box.clientWidth,H=box.clientHeight;
  const list=R.pos.split(';').filter(Boolean).map(s=>s.split('|')).filter(x=>x[0]!==mine);
  const lob=R.phase==='lobby';
  const zones=lob?{'':[0,W]}:{A:[0,W*.4],'':[W*.4,W*.6],B:[W*.6,W]};
  const groups={A:[],B:[],'':[]};
  for(const x of list)groups[lob?'':(x[3]||'')].push(x);
  const seen=new Set(),top=46,bottom=H-120;
  for(const [k,[x0,x1]] of Object.entries(zones)){
    const g=groups[k];if(!g.length)continue;
    const w=x1-x0-8,h=Math.max(60,bottom-top);
    let s=Math.floor(Math.sqrt(w*h/g.length));s=Math.max(13,Math.min(34,s));
    let cols=Math.max(1,Math.floor(w/s)),rows=Math.ceil(g.length/cols);
    while(rows*s>h&&s>13){s--;cols=Math.max(1,Math.floor(w/s));rows=Math.ceil(g.length/cols)}
    const size=Math.max(11,Math.floor(s*.86)),offX=x0+4+(w-cols*s)/2,offY=top+Math.max(0,(h-rows*s)/2);
    g.forEach((x,i)=>{const [id,av,col,side]=x;seen.add(id);let el=crowdEls.get(id);
      if(!el){el=document.createElement('div');el.className='cv';el.style.left=(W/2)+'px';el.style.top=(H/2)+'px';box.appendChild(el);crowdEls.set(id,el)}
      el.textContent=av;el.style.background=col;el.style.width=el.style.height=size+'px';el.style.fontSize=(size*.62)+'px';
      el.classList.toggle('dead',R.phase==='reveal'&&side!==R.ans);
      el.style.left=(offX+(i%cols)*s)+'px';el.style.top=(offY+Math.floor(i/cols)*s)+'px'});
  }
  for(const [id,el] of crowdEls)if(!seen.has(id)){el.remove();crowdEls.delete(id)}
}
addEventListener('resize',()=>renderCrowd(true));
function tick(){
  if(R){const left=clock(R),locked=R.phase==='locked'||(R.phase==='question'&&left<=0);
    $('ovLocked').classList.toggle('on',locked);
    $('hint').style.display=R.phase==='question'&&!locked&&isAlive()&&!curChoice()?'':'none';
    if(R.phase==='question'){$('tbi').style.width=Math.min(100,left/(R.dur*1000)*100)+'%';$('tb').classList.toggle('low',left<3000)}
    else $('tbi').style.width=R.phase==='lobby'?'100%':'0%'}
  requestAnimationFrame(tick)}
tick();
</script>
</body></html>
